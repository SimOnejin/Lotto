<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 생성기</title>


    <link rel="stylesheet" href="style.css">
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
<div class="top-bar">
        <button id="showQR" class="QR-btn btn btn-secondary" data-bs-toggle="modal" data-bs-target="#myModal" >QR code</button>
		<button id="themeToggle">🌙 다크모드</button>
</div>

<div class="container">
    <h1>🎲 로또 번호 생성기</h1>

    <div class="controls">
        <div>
            <label>로또 종류</label><br>
            <select id="numberCount">
                <option value="7">Lotto7</option>
                <option value="6">Lotto6</option>
            </select>
        </div>

        <div>
            <label>생성 횟수</label><br>
            <select id="drawCount">
                <option value="1">1회</option>
                <option value="2">2회</option>
                <option value="3">3회</option>
                <option value="5" selected>5회</option>
                <option value="10">10회</option>
            </select>
        </div>
        
        
        
        
        
		<div class="slot-container">

		    <label class="switch">
		        <input
		            type="checkbox"
		            id="slotMode">

		        <span class="slider"></span>
		    </label>

		    <span>슬롯머신 효과</span>

		</div>
        
        
        
        
        

        <div style="align-self:end;">
            <button class="main-btn" onclick="generateLotto()">
                🎲 번호 생성하기
            </button>
        </div>



		<div class="middle-bar">
			<button class="btn btn-success" onclick="location.href='winning.html'">
			    당첨번호 입력
			</button>

	        <div style="align-self:end;">
	            <button class="clear-btn" onclick="clearHistory()">이력 삭제</button>
	        </div>
	        

        </div>
	    
	    
	    <div class="winning-area">
			    <div id="winningToggle" onclick="toggleWinningInfo()">
			        ▶ 당첨번호 보기
			    </div>
			    <div id="winningInfo"></div>
			    <a href="https://www.mizuhobank.co.jp/takarakuji/check/index.html" target="_blank" >로또번호 확인</a>
		</div>

    </div>

    <div id="result" class="result"></div>

    <div class="history">
        <h2>생성 이력</h2>
        <div id="history"></div>
    </div>
</div>










<div class="modal fade" id="myModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">QR CODE</h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">
                <img src="./qr.png" id="qr">
            </div>

            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    닫기
                </button>
            </div>

        </div>
    </div>
</div>














<script>
function generateNumbers(count){

    const maxNumber =
        count === 7 ? 37 : 43;

    const numbers = [];

    while(numbers.length < count){

        const num =
            Math.floor(Math.random() * maxNumber) + 1;

        if(!numbers.includes(num)){
            numbers.push(num);
        }
    }

    return numbers.sort((a,b)=>a-b);
}



function animateNumber(element, finalNumber, maxNumber){

	console.log(
    "final =", finalNumber,
    "max =", maxNumber
);//max = undefined 문제 계속 발생 해결 필요.maxNumber를 파라미터로써 못 받나?

    return new Promise(resolve => {

        element.classList.add("spinning");

        let delay = 50;

        let spinCount =
            Math.floor(Math.random() * 20) + 20;

        function changeNumber(num){

            element.innerHTML =
                `<span class="rolling">
                    ${num}
                </span>`;
        }

        function spin(count){

            if(count <= 0){

                element.innerHTML =
                    `<span class="final">
                        ${finalNumber}
                    </span>`;

                element.classList.remove("spinning");
                element.classList.add("stop");

                resolve();

                return;
            }

            const randomNum =
                Math.floor(Math.random() * (maxNumber || 37)) + 1;

            changeNumber(randomNum);

            // 마지막 3회 감속
            if(count <= 3){
                delay += 150;
            }

            setTimeout(() => {

                spin(count - 1);

            }, delay);
        }

        spin(spinCount);

    });

}



async function animateTicket(ticket, nums){

    const promises = [];

    nums.forEach(n => {

	    const span =
	        document.createElement("span");

	    span.className = "number";

	    ticket.appendChild(span);

		const slotEnabled =
		    localStorage.getItem("slotMode")
		    === "true";

		if(slotEnabled){
		    animateNumber(
		        span,
		        n, 
		        maxNumber
		    );
		}else{
		    span.textContent = n;
		}

	});

    await Promise.all(promises);
}











async function generateLotto(){



    const numberCount =
        Number(
            document.getElementById("numberCount").value
        );

    const drawCount =
        Number(
            document.getElementById("drawCount").value
        );

    const resultDiv =
        document.getElementById("result");

const maxNumber =
    numberCount === 7 ? 37 : 43;


    resultDiv.innerHTML = "";

    const allResults = [];

    const tickets = [];

    // 티켓 전부 먼저 생성
    for(let i = 0; i < drawCount; i++){

        const nums =
            generateNumbers(numberCount);

        allResults.push(nums);

        const ticket =
            document.createElement("div");

        ticket.className = "ticket";

        resultDiv.appendChild(ticket);

        tickets.push({
            ticket,
            nums
        });
    }

    const slotEnabled =
        localStorage.getItem("slotMode")
        === "true";

    // 슬롯머신 OFF
    if(!slotEnabled){

        tickets.forEach(item => {

            item.nums.forEach(n => {

                const span =
                    document.createElement("span");

                span.className = "number";

                span.textContent = n;

                item.ticket.appendChild(span);

            });

        });

    }

    // 슬롯머신 ON
    else{

        const animations = [];

tickets.forEach((item, ticketIndex) => {

    item.nums.forEach(n => {

        const span =
            document.createElement("span");

        span.className =
            "number spinning";

        item.ticket.appendChild(span);

        animations.push(

            new Promise(resolve => {

                setTimeout(async () => {

                    await animateNumber(
                        span,
                        n,
                        item.maxNumber
                    );

                    resolve();

                }, ticketIndex * 350);

            })

        );

    });

});

await Promise.all(animations);

    }

    saveHistory(
        numberCount,
        drawCount,
        allResults
    );

    loadHistory();

}













function saveHistory(numberCount, drawCount, results){
    const history = JSON.parse(localStorage.getItem("lottoHistory") || "[]");

    history.unshift({
        id: Date.now(),
        date: new Date().toLocaleString('ko-KR', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
            }),
        numberCount,
        drawCount,
        results
    });

    localStorage.setItem(
        "lottoHistory",
        JSON.stringify(history)
    );
}






function checkLotteryRank(
    lotteryType,
    winningNumbers,
    bonusNumbers,
    userNumbers
){

    const mainMatchCount =
        userNumbers.filter(
            num => winningNumbers.includes(num)
        ).length;

    const bonusMatchCount =
        userNumbers.filter(
            num => bonusNumbers.includes(num)
        ).length;

    let rank = "낙첨";

    if(lotteryType === "6"){

        if(mainMatchCount === 6){
            rank = "1등";
        }
        else if(
            mainMatchCount === 5 &&
            bonusMatchCount >= 1
        ){
            rank = "2등";
        }
        else if(mainMatchCount === 5){
            rank = "3등";
        }
        else if(mainMatchCount === 4){
            rank = "4등";
        }
        else if(mainMatchCount === 3){
            rank = "5등";
        }

    }else{

        if(mainMatchCount === 7){
            rank = "1등";
        }
        else if(
            mainMatchCount === 6 &&
            bonusMatchCount >= 1
        ){
            rank = "2등";
        }
        else if(mainMatchCount === 6){
            rank = "3등";
        }
        else if(mainMatchCount === 5){
            rank = "4등";
        }
        else if(mainMatchCount === 4){
            rank = "5등";
        }
        else if(
            mainMatchCount === 3 &&
            bonusMatchCount >= 1
        ){
            rank = "6등";
        }

    }

    return {
        rank,
        mainMatchCount,
        bonusMatchCount
    };
}





function loadHistory(){

    const history = JSON.parse(
        localStorage.getItem("lottoHistory") || "[]"
    );

    const historyDiv =
        document.getElementById("history");

    historyDiv.innerHTML = "";

    history.forEach(item=>{
    
    
		const lotteryType =
		    localStorage.getItem("lotteryType");

		const winningNumbers =
		    (localStorage.getItem("winningNumbers") || "")
		        .split(" ")
		        .map(Number);

		const bonusNumbers =
		    (localStorage.getItem("bonusNumbers") || "")
		        .split(" ")
		        .map(Number);
		    
    
    

        const details =
            document.createElement("details");

        details.className = "history-item";

        const summary =
            document.createElement("summary");

        summary.textContent =
            `${item.date} (${item.drawCount}회 생성)`;

        details.appendChild(summary);

        const content =
            document.createElement("div");

        content.className = "history-content";


content.innerHTML =
item.results.map(arr => {

    const result =
        checkLotteryRank(
            lotteryType,
            winningNumbers,
            bonusNumbers,
            arr
        );

    return `

        <div class="history-ticket">

            ${arr.map(num => {

                let cls = "ball";

                if(winningNumbers.includes(num)){
                    cls += " match";
                }
                else if(
                    bonusNumbers.includes(num)
                ){
                    cls += " bonus-match";
                }

                return `
                    <span class="${cls}">
                        ${num}
                    </span>
                `;
            }).join('')}

            <div class="rank-info">

                ${result.rank}

                (본번호
                ${result.mainMatchCount}개,

                보너스
                ${result.bonusMatchCount}개)

            </div>

        </div>
    `;

}).join('');

        const deleteBtn =
            document.createElement("button");

		deleteBtn.innerHTML = "🗑";
		deleteBtn.className = "delete-btn";



        deleteBtn.onclick = () =>{
            deleteHistory(item.id);
        };

        content.appendChild(
            document.createElement("br")
        );

        content.appendChild(deleteBtn);

        details.appendChild(content);

        historyDiv.appendChild(details);
    });
  
}

function clearHistory(){
    if(confirm("이력을 모두 삭제할까요?")){
        localStorage.removeItem("lottoHistory");
        loadHistory();
    }
}

function deleteHistory(id){

    let history = JSON.parse(
        localStorage.getItem("lottoHistory") || "[]"
    );

    history = history.filter(
        item => item.id !== id
    );

    localStorage.setItem(
        "lottoHistory",
        JSON.stringify(history)
    );

    loadHistory();
}


function showWinningInfo(){

    const lotteryType =
        localStorage.getItem("lotteryType");

    const winningNumbers =
        localStorage.getItem("winningNumbers");

    const bonusNumbers =
        localStorage.getItem("bonusNumbers");

    document.getElementById("winningInfo").innerHTML =

        lotteryType ?

        `
            <b>Loto${lotteryType}</b><br>
            본번호 : ${winningNumbers}<br>
            보너스 : ${bonusNumbers}
        `

        :

        "등록된 당첨번호 없음";
}

showWinningInfo();



function toggleWinningInfo(){

    const info =
        document.getElementById("winningInfo");

    const toggle =
        document.getElementById("winningToggle");

    if(info.classList.contains("show")){

        info.classList.remove("show");

        toggle.textContent =
            "▶ 당첨번호 보기";

        return;
    }

    const lotteryType =
        localStorage.getItem("lotteryType");

    const winningNumbers =
        localStorage.getItem("winningNumbers");

    const bonusNumbers =
        localStorage.getItem("bonusNumbers");

    if(!lotteryType){

        info.innerHTML =
            "등록된 당첨번호가 없습니다.";

    }else{

        info.innerHTML = `
            <div>
                <b>Loto${lotteryType}</b>
            </div>

            <div>
                본번호 : ${winningNumbers}
            </div>

            <div>
                보너스 : ${bonusNumbers}
            </div>
        `;
    }

    info.classList.add("show");

    toggle.textContent =
        "▼ 당첨번호 숨기기";
}

const slotMode =
    document.getElementById("slotMode");

function loadSlotMode(){

    const saved =
        localStorage.getItem("slotMode");

    if(saved === "true"){
        slotMode.checked = true;
    }

}

slotMode.addEventListener("change", () => {

    localStorage.setItem(
        "slotMode",
        slotMode.checked
    );

});

loadSlotMode();

loadHistory();
</script>

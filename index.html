<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 생성기</title>


    <link rel="stylesheet" href="style.css">
    
<style>

</style>
</head>
<body>


    
<script src="script.js"></script>


    
<div class="top-bar">
    <button id="themeToggle">🌙 다크모드</button>
</div>

<div class="container">
    <h1>🎲 로또 번호 생성기</h1>

    <div class="controls">
        <div>
            <label>번호 개수</label><br>
            <select id="numberCount">
                <option value="6">6개</option>
                <option value="7">7개</option>
            </select>
        </div>

        <div>
            <label>생성 횟수</label><br>
            <select id="drawCount">
                <option value="1">1회</option>
                <option value="2">2회</option>
                <option value="3">3회</option>
                <option value="5">5회</option>
                <option value="10">10회</option>
            </select>
        </div>

        <div style="align-self:end;">
            <button class="main-btn" onclick="generateLotto()">
                🎲 번호 생성하기
            </button>
        </div>

        <div style="align-self:end;">
            <button class="clear-btn" onclick="clearHistory()">이력 삭제</button>
        </div>
    </div>

    <div id="result" class="result"></div>

    <div class="history">
        <h2>생성 이력</h2>
        <div id="history"></div>
    </div>
</div>

<script>
function generateNumbers(count){
    const numbers = [];

    while(numbers.length < count){
        const num = Math.floor(Math.random() * 45) + 1;

        if(!numbers.includes(num)){
            numbers.push(num);
        }
    }

    return numbers.sort((a,b)=>a-b);
}

function generateLotto(){
    const numberCount = Number(document.getElementById("numberCount").value);
    const drawCount = Number(document.getElementById("drawCount").value);

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "";

    const allResults = [];

    for(let i=0;i<drawCount;i++){
        const nums = generateNumbers(numberCount);

        allResults.push(nums);

        const ticket = document.createElement("div");
        ticket.className = "ticket";

        nums.forEach(n=>{
            const span = document.createElement("span");
            span.className = "number";
            span.textContent = n;
            ticket.appendChild(span);
        });

        resultDiv.appendChild(ticket);
    }

    saveHistory(numberCount, drawCount, allResults);
    loadHistory();
}

function saveHistory(numberCount, drawCount, results){
    const history = JSON.parse(localStorage.getItem("lottoHistory") || "[]");

    history.unshift({
        date: new Date().toLocaleString(),
        numberCount,
        drawCount,
        results
    });

    localStorage.setItem(
        "lottoHistory",
        JSON.stringify(history)
    );
}

function loadHistory(){
    const history = JSON.parse(localStorage.getItem("lottoHistory") || "[]");

    const historyDiv = document.getElementById("history");
    historyDiv.innerHTML = "";

    history.forEach(item=>{
        const div = document.createElement("div");
        div.className = "history-item";

        div.innerHTML = `
            <strong>${item.date}</strong><br>
            ${item.results
                .map(arr => arr.join(", "))
                .join("<br>")}
        `;

        historyDiv.appendChild(div);
    });
}

function clearHistory(){
    if(confirm("이력을 모두 삭제할까요?")){
        localStorage.removeItem("lottoHistory");
        loadHistory();
    }
}

loadHistory();
</script>

</body>
</html>
